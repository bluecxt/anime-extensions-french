name: Weekly Extension Integration Tests

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Number of parallel extension suites to execute'
        required: false
        default: '4'
      specs_path:
        description: 'Path or pattern to test specs'
        required: false
        default: 'samples/french'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-classes:
    name: Build Extension Classes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for recent commits (Schedule filter)
        id: commit-check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COMMITS=$(git log --since="7 days ago" --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No commits found in the last 7 days. Skipping scheduled test run."
              echo "skip_tests=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Commits detected in last 7 days:"
            echo "$COMMITS"
          fi
          echo "skip_tests=false" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.commit-check.outputs.skip_tests != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        if: steps.commit-check.outputs.skip_tests != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build extensions bytecode & debug classes
        if: steps.commit-check.outputs.skip_tests != 'true'
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
          TVDB_API: ${{ secrets.TVDB_API }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload compiled classes & specs artifact
        if: steps.commit-check.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extension-binaries
          path: |
            src/**/build/
            core/build/
            lib-multisrc/**/build/
            samples/
            scripts/
          retention-days: 1

    outputs:
      skip_tests: ${{ steps.commit-check.outputs.skip_tests }}

  test-extensions:
    name: Run Anime Extension Tests
    needs: build-classes
    if: needs.build-classes.outputs.skip_tests != 'true'
    runs-on: [self-hosted, linux]
    timeout-minutes: 60

    steps:
      - name: Checkout repository structure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download compiled classes & specs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: extension-binaries
          path: ${{ github.workspace }}

      - name: Setup anime-extension-tester CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/anime-extension-tester
          mkdir -p /tmp/anime-extension-tester
          gh release download --repo bluecxt/anime-extension-tester --pattern "*.tar" --dir /tmp/anime-extension-tester
          TAR_FILE=$(find /tmp/anime-extension-tester -name "*.tar" | head -n 1)
          tar -xf "$TAR_FILE" -C /tmp/anime-extension-tester --strip-components=1
          chmod +x /tmp/anime-extension-tester/bin/anime-extension-tester

      - name: Start Smart Cloudflare Solver Proxy
        run: |
          chmod +x ./scripts/flaresolverr_smart_proxy.py
          python3 ./scripts/flaresolverr_smart_proxy.py 8080 http://127.0.0.1:8191/v1 &
          PROXY_PID=$!
          echo "PROXY_PID=$PROXY_PID" >> "$GITHUB_ENV"
          sleep 1

      - name: Execute Extension Test Suites
        env:
          INPUT_SPECS: ${{ github.event.inputs.specs_path }}
          INPUT_CONCURRENCY: ${{ github.event.inputs.concurrency }}
        run: |
          RAW_SPECS="${INPUT_SPECS:-samples/french}"
          if [[ "$RAW_SPECS" = /* ]]; then
            SPECS="$RAW_SPECS"
          else
            SPECS="$GITHUB_WORKSPACE/$RAW_SPECS"
          fi
          CONCURRENCY="${INPUT_CONCURRENCY:-4}"
          /tmp/anime-extension-tester/bin/anime-extension-tester --specs="$SPECS" --extension-dir="$GITHUB_WORKSPACE/src/fr" --concurrency="$CONCURRENCY" --proxy=http://127.0.0.1:8080

      - name: Stop Smart Proxy
        if: always() && env.PROXY_PID != ''
        run: |
          kill "$PROXY_PID" 2>/dev/null || true
