name: Detekt Static Analysis

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'core/**'
      - 'config/detekt.yml'
      - 'build.gradle.kts'
      - '.github/scripts/merge-detekt-sarif.py'
      - '.github/workflows/detekt.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'core/**'
      - 'config/detekt.yml'
      - 'build.gradle.kts'
      - '.github/scripts/merge-detekt-sarif.py'
      - '.github/workflows/detekt.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Run Detekt Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run Detekt
        env:
          TMDB_API: "dummy"
          TVDB_API: "dummy"
          WEBHOOK_URL: "dummy"
          WEBHOOK_SECRET: "dummy"
        run: ./gradlew detekt --continue

      - name: Merge Detekt SARIF reports
        run: python3 ./.github/scripts/merge-detekt-sarif.py

      - name: Upload Detekt SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.28.11
        with:
          sarif_file: build/reports/detekt/detekt-merged.sarif
          checkout_path: ${{ github.workspace }}
