name: Detekt Static Analysis

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "core/**"
      - "config/detekt.yml"
      - "build.gradle.kts"
      - ".github/scripts/merge-detekt-sarif.py"
      - ".github/workflows/detekt.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "src/**"
      - "core/**"
      - "config/detekt.yml"
      - "build.gradle.kts"
      - ".github/scripts/merge-detekt-sarif.py"
      - ".github/workflows/detekt.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Run Detekt Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run Detekt
        env:
          TMDB_API: "dummy"
          TVDB_API: "dummy"
          WEBHOOK_URL: "dummy"
          WEBHOOK_SECRET: "dummy"
        run: ./gradlew detekt --continue

      - name: Merge Detekt SARIF reports
        run: python3 ./.github/scripts/merge-detekt-sarif.py

      - name: Upload Detekt SARIF Report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3.28.11
        with:
          sarif_file: build/reports/detekt/detekt-merged.sarif
          checkout_path: ${{ github.workspace }}
